<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Chaos Brick Ball — 10 Levels</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;background:#080b18;color:#fff;
  font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;
  align-items:center;overflow:hidden
}
#wrap{width:min(960px,100vw);padding:12px}
.top{
  display:flex;justify-content:space-between;align-items:center;
  gap:8px;margin-bottom:8px;flex-wrap:wrap
}
h1{font-size:22px;margin:0;color:#fff}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{
  background:#11172c;border:1px solid #273052;border-radius:9px;
  padding:7px 11px;font-size:13px
}
canvas{
  width:100%;height:auto;display:block;background:#0b1024;
  border:2px solid #28365e;border-radius:14px;box-shadow:0 12px 45px #0008;
  touch-action:none
}
.help{text-align:center;color:#aeb9d8;font-size:12px;margin-top:8px}
button{
  border:0;border-radius:9px;padding:8px 13px;background:#506dff;color:white;
  font-weight:bold;cursor:pointer
}
button:hover{filter:brightness(1.12)}
#overlay{
 position:fixed;inset:0;background:#0009;display:flex;align-items:center;
 justify-content:center;z-index:10
}
.card{
 width:min(420px,90vw);background:#10162b;border:1px solid #33416d;
 border-radius:18px;padding:28px;text-align:center;box-shadow:0 20px 70px #000
}
.card h2{font-size:30px;margin:0 0 10px}
.card p{color:#b9c4e1;line-height:1.5}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="wrap">
  <div class="top">
    <h1>⚡ Chaos Brick Ball</h1>
    <div class="stats">
      <div class="stat">Level: <b id="level">1</b>/10</div>
      <div class="stat">Score: <b id="score">0</b></div>
      <div class="stat">Nyawa: <b id="lives">3</b></div>
      <button id="pause">Pause</button>
      <button id="restart">Restart</button>
    </div>
  </div>
  <canvas id="game" width="900" height="560"></canvas>
  <div class="help">Gerakkan paddle dengan ← → / A D atau mouse. Hancurkan semua brick untuk lanjut level.</div>
</div>

<div id="overlay">
  <div class="card">
    <h2 id="title">Chaos Brick Ball</h2>
    <p id="message">Hancurkan semua brick dan selesaikan 10 level. Ada power-up dan brick kuat yang makin sulit di level tinggi.</p>
    <button id="start">Mulai Game</button>
  </div>
</div>

<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");
const W=canvas.width,H=canvas.height;
const levelEl=document.getElementById("level"),scoreEl=document.getElementById("score"),livesEl=document.getElementById("lives");
const overlay=document.getElementById("overlay"),titleEl=document.getElementById("title"),messageEl=document.getElementById("message");
let level=1,score=0,lives=3,running=false,paused=false;
let keys={},bricks=[],powerups=[],particles=[];
let paddle={x:W/2-65,y:H-34,w:130,h:13,speed:8};
let ball={x:W/2,y:H-60,r:8,vx:4,vy:-5};
let activePowerups={wide:0,multi:0,slow:0};
let balls=[];

document.addEventListener("keydown",e=>{
  keys[e.key.toLowerCase()]=true;
  if(["arrowleft","arrowright"," "].includes(e.key.toLowerCase())) e.preventDefault();
  if(e.key===" " && running) paused=!paused;
});
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

canvas.addEventListener("pointermove",e=>{
  const r=canvas.getBoundingClientRect();
  paddle.x=(e.clientX-r.left)/r.width*W-paddle.w/2;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));
});

document.getElementById("pause").onclick=()=>{
  if(running) paused=!paused;
};
document.getElementById("restart").onclick=()=>{
  score=0;lives=3;level=1;loadLevel();running=true;paused=false;overlay.classList.add("hidden");
};
document.getElementById("start").onclick=()=>{
  score=0;lives=3;level=1;loadLevel();running=true;paused=false;overlay.classList.add("hidden");
};

function loadLevel(){
  levelEl.textContent=level;scoreEl.textContent=score;livesEl.textContent=lives;
  paddle.w=level>=5?115:130;paddle.x=W/2-paddle.w/2;
  powerups=[];particles=[];activePowerups={wide:0,multi:0,slow:0};
  bricks=[];
  const rows=Math.min(5+Math.floor((level-1)/2),8);
  const cols=10;
  const gap=6, margin=38, bw=(W-margin*2-gap*(cols-1))/cols, bh=25;
  const patterns=[
    ()=>true,
    (r,c)=>r!==2||c<3||c>6,
    (r,c)=>(r+c)%2===0,
    (r,c)=>Math.abs(c-4.5)<r+1,
    (r,c)=>c===0||c===cols-1||r===0||r===rows-1||c===4||c===5,
    (r,c)=>r<2||c<2||c>7||(r===3&&c>2&&c<7),
    (r,c)=>(c===r||c===cols-1-r||r===0||r===rows-1),
    (r,c)=>true
  ];
  const pattern=patterns[Math.min(level-1,patterns.length-1)];
  for(let r=0;r<rows;r++){
    for(let c=0;c<cols;c++){
      if(!pattern(r,c)) continue;
      const hp=1+(level>=4&&Math.random()<.28?1:0)+(level>=8&&Math.random()<.18?1:0);
      bricks.push({
        x:margin+c*(bw+gap),y:55+r*(bh+gap),w:bw,h:bh,hp,maxHp:hp,
        alive:true
      });
    }
  }
  resetBall();
}
function resetBall(){
  ball={x:W/2,y:H-70,r:8,vx:(Math.random()<.5?-1:1)*(3.5+level*.15),vy:-(5+level*.18)};
  balls=[ball];
}
function addParticles(x,y){
  for(let i=0;i<7;i++) particles.push({
    x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,life:25+Math.random()*15
  });
}
function spawnPower(x,y){
  if(Math.random()>0.18) return;
  const types=["wide","multi","slow"];
  const type=types[Math.floor(Math.random()*types.length)];
  powerups.push({x,y,w:22,h:10,vy:2.2,type});
}
function activate(type){
  if(type==="wide"){activePowerups.wide=600;paddle.w=180}
  if(type==="slow"){activePowerups.slow=600;balls.forEach(b=>{b.vx*=.7;b.vy*=.7})}
  if(type==="multi" && balls.length<4){
    const source=balls[0]||ball;
    const b1={...source,vx:-Math.abs(source.vx)-1,vy:source.vy};
    const b2={...source,vx:Math.abs(source.vx)+1,vy:source.vy};
    balls.push(b1,b2);
  }
}
function circleRectHit(b,r){
  const nx=Math.max(r.x,Math.min(b.x,r.x+r.w));
  const ny=Math.max(r.y,Math.min(b.y,r.y+r.h));
  const dx=b.x-nx,dy=b.y-ny;
  return dx*dx+dy*dy<b.r*b.r;
}
function update(){
  if(!running||paused)return;
  if(keys["arrowleft"]||keys["a"]) paddle.x-=paddle.speed;
  if(keys["arrowright"]||keys["d"]) paddle.x+=paddle.speed;
  paddle.x=Math.max(0,Math.min(W-paddle.w,paddle.x));

  for(const k in activePowerups) if(activePowerups[k]>0) activePowerups[k]--;
  if(activePowerups.wide===0 && paddle.w>135) paddle.w=level>=5?115:130;

  for(let i=balls.length-1;i>=0;i--){
    const b=balls[i];
    b.x+=b.vx;b.y+=b.vy;
    if(b.x-b.r<0){b.x=b.r;b.vx=Math.abs(b.vx)}
    if(b.x+b.r>W){b.x=W-b.r;b.vx=-Math.abs(b.vx)}
    if(b.y-b.r<0){b.y=b.r;b.vy=Math.abs(b.vy)}

    if(b.vy>0 && circleRectHit(b,paddle)){
      const hit=(b.x-(paddle.x+paddle.w/2))/(paddle.w/2);
      b.vx=hit*7;
      b.vy=-Math.abs(b.vy)-.05;
      b.y=paddle.y-b.r-1;
    }

    for(const br of bricks){
      if(!br.alive||!circleRectHit(b,br))continue;
      const prevX=b.x-b.vx,prevY=b.y-b.vy;
      if(prevX<b.x && (prevX<br.x||prevX>br.x+br.w)) b.vx*=-1;
      else if(prevY<br.y||prevY>br.y+br.h) b.vy*=-1;
      else b.vy*=-1;
      br.hp--;score+=10*level;addParticles(b.x,b.y);
      if(br.hp<=0){br.alive=false;score+=25*level;spawnPower(br.x+br.w/2,br.y+br.h/2)}
      break;
    }
    if(b.y-b.r>H) balls.splice(i,1);
  }

  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];p.y+=p.vy;
    if(p.y>H){powerups.splice(i,1);continue}
    if(p.x+p.w>paddle.x&&p.x<paddle.x+paddle.w&&p.y+p.h>paddle.y&&p.y<paddle.y+paddle.h){
      activate(p.type);powerups.splice(i,1);score+=50;
    }
  }
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0)particles.splice(i,1)
  }

  if(balls.length===0){
    lives--;livesEl.textContent=lives;
    if(lives<=0){gameOver();return}
    resetBall();
  }
  if(bricks.every(b=>!b.alive)){
    if(level>=10){win();return}
    level++;loadLevel();
  }
  scoreEl.textContent=score;
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#0b1028");g.addColorStop(1,"#12182e");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // stars
  ctx.fillStyle="#ffffff55";
  for(let i=0;i<45;i++){const x=(i*193)%W,y=(i*83)%H;ctx.fillRect(x,y,1,1)}

  for(const br of bricks){
    if(!br.alive)continue;
    ctx.fillStyle=br.hp>=3?"#ff5d8f":br.hp===2?"#ffb84d":"#55c7ff";
    ctx.fillRect(br.x,br.y,br.w,br.h);
    ctx.fillStyle="#ffffff25";ctx.fillRect(br.x,br.y,br.w,5);
    if(br.hp>1){
      ctx.fillStyle="#10152a";ctx.font="bold 12px Arial";ctx.textAlign="center";
      ctx.fillText(br.hp,br.x+br.w/2,br.y+17);
    }
  }

  ctx.fillStyle=activePowerups.wide>0?"#b5ff62":"#627cff";
  ctx.fillRect(paddle.x,paddle.y,paddle.w,paddle.h);
  ctx.fillStyle="#fff";ctx.fillRect(paddle.x+10,paddle.y+2,paddle.w-20,3);

  for(const b of balls){
    ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fillStyle="#fff";ctx.fill();
    ctx.beginPath();ctx.arc(b.x,b.y,b.r+4,0,Math.PI*2);ctx.strokeStyle="#75a7ff55";ctx.stroke();
  }

  const icons={wide:"W",multi:"×",slow:"S"};
  for(const p of powerups){
    ctx.fillStyle=p.type==="wide"?"#b5ff62":p.type==="multi"?"#ff72dc":"#7fe7ff";
    ctx.fillRect(p.x,p.y,p.w,p.h);
    ctx.fillStyle="#111";ctx.font="bold 9px Arial";ctx.textAlign="center";ctx.fillText(icons[p.type],p.x+p.w/2,p.y+8)
  }

  for(const p of particles){
    ctx.globalAlpha=Math.max(0,p.life/40);ctx.fillStyle="#fff";ctx.fillRect(p.x,p.y,3,3)
  }
  ctx.globalAlpha=1;

  if(paused&&running){
    ctx.fillStyle="#0009";ctx.fillRect(0,0,W,H);
    ctx.fillStyle="#fff";ctx.font="bold 42px Arial";ctx.textAlign="center";ctx.fillText("PAUSED",W/2,H/2);
  }
}
function gameOver(){
  running=false;titleEl.textContent="Game Over";messageEl.innerHTML=`Skor akhir: <b>${score}</b><br>Level tercapai: <b>${level}</b>/10`;
  document.getElementById("start").textContent="Main Lagi";overlay.classList.remove("hidden");
}
function win(){
  running=false;titleEl.textContent="🏆 Kamu Menang!";messageEl.innerHTML=`Semua 10 level selesai!<br>Skor akhir: <b>${score}</b>`;
  document.getElementById("start").textContent="Main Lagi";overlay.classList.remove("hidden");
}
function loop(){update();draw();requestAnimationFrame(loop)}
loadLevel();draw();loop();
</script>
</body>
</html>
